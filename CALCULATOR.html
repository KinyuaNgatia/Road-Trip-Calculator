<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Pricing Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Tour Pricing Calculator</h1>

      <h2>Trip Inputs</h2>
      <div class="grid">
        <div class="input-group">
          <label for="clients">Number of Clients</label>
          <input type="number" id="clients" value="5" placeholder="e.g. 5" />
        </div>
        <div class="input-group">
          <label for="hireCost">Vehicle Hire Cost (KES)</label>
          <input
            type="number"
            id="hireCost"
            value="4000"
            placeholder="e.g. 4000"
          />
        </div>
        <div class="input-group">
          <label for="distance">Total Distance (km)</label>
          <input
            type="number"
            id="distance"
            value="210"
            placeholder="e.g. 210"
          />
        </div>
        <div class="input-group">
          <label for="fuelEfficiency">Fuel Consumption (km/L)</label>
          <input
            type="number"
            id="fuelEfficiency"
            value="14"
            placeholder="e.g. 14"
          />
        </div>
      </div>

      <h2>Per-Person Costs</h2>
      <div class="grid">
        <div class="input-group">
          <label for="entryFee">Entry Fee (KES)</label>
          <input
            type="number"
            id="entryFee"
            value="500"
            placeholder="e.g. 500"
          />
        </div>
        <div class="input-group">
          <label for="activityFee">Main Activity (KES)</label>
          <input
            type="number"
            id="activityFee"
            value="400"
            placeholder="e.g. 400"
          />
        </div>
        <div class="input-group">
          <label for="lunch">Lunch (KES)</label>
          <input type="number" id="lunch" value="800" placeholder="e.g. 800" />
        </div>
        <div class="input-group">
          <label for="snacks">Water / Snacks (KES)</label>
          <input type="number" id="snacks" value="300" placeholder="e.g. 300" />
        </div>
      </div>

      <button id="calculateBtn">Calculate Pricing</button>

      <div class="results" id="results"></div>
    </div>

    <!-- Chat Widget -->
<div id="chat-widget">
  <div id="chat-window">
    <div class="chat-header">
      <span>AI Assistant</span>
      <span style="cursor:pointer; opacity:0.8;" onclick="document.getElementById('chat-toggle').click()">✕</span>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-message bot">Hello! I'm your Road Trip AI. Ask me about distance, fuel, or advice.</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Ask something..." />
      <button id="chat-send">Send</button>
    </div>
  </div>
  <button id="chat-toggle">💬</button>
</div>

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
